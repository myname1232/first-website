<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>✨ 惊喜时刻</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0b0b2a; font-family: 'Microsoft YaHei', sans-serif; }
        #message {
            position: absolute;
            bottom: 15%;
            width: 100%;
            text-align: center;
            color: white;
            pointer-events: none;
            text-shadow: 0 0 20px rgba(255,215,0,0.5);
            z-index: 10;
        }
        h1 { font-size: 2.5rem; margin-bottom: 10px; color: #ffd700; letter-spacing: 2px;}
        p { font-size: 1.2rem; opacity: 0.9; }
    </style>
</head>
<body>
    <div id="message">
        <h1>🎂 生日快乐 🎂</h1>
        <p>愿你所有的愿望都能实现！</p >
    </div>

    <!-- 引入 3D 渲染引擎 Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';

        // 初始化场景、相机和渲染器
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0b2a); // 深空蓝背景

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- 1. 制作底座 (蛋糕底盘) ---
        const baseGeometry = new THREE.CylinderGeometry(1.8, 2, 0.4, 32);
        const baseMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x4a90e2, 
            metalness: 0.3, 
            roughness: 0.4,
            emissive: new THREE.Color(0x1a237e),
            emissiveIntensity: 0.2
        });
        const base = new THREE.Mesh(baseGeometry, baseMaterial);
        base.position.y = -0.2;
        scene.add(base);

        // --- 2. 制作中间的发光大星星 (代表蜡烛) ---
        const starGeometry = new THREE.OctahedronGeometry(0.6);
        const starMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xffaa00, 
            emissive: new THREE.Color(0xff6600),
            emissiveIntensity: 2,
            metalness: 0.8,
            roughness: 0.2
        });
        const star = new THREE.Mesh(starGeometry, starMaterial);
        star.position.y = 0.6;
        scene.add(star);

        // 给星星加一个光晕 (点光源)
        const pointLight = new THREE.PointLight(0xffaa00, 2, 10);
        pointLight.position.set(0, 0.6, 0);
        scene.add(pointLight);

        // 蜡烛光晕 (小的透明球)
        const glowGeometry = new THREE.SphereGeometry(0.8, 16, 16);
        const glowMaterial = new THREE.MeshBasicMaterial({ 
            color: 0xff8800, 
            transparent: true, 
            opacity: 0.2 
        });
        const glow = new THREE.Mesh(glowGeometry, glowMaterial);
        glow.position.y = 0.6;
        scene.add(glow);

        // --- 3. 漫天繁星粒子系统 ---
        const starCount = 800;
        const starPositions = new Float32Array(starCount * 3);
        const starColors = new Float32Array(starCount * 3);
        const sizes = new Float32Array(starCount);

        for (let i = 0; i < starCount; i++) {
            // 让粒子分布在一个球体内部
            const radius = 3 + Math.random() * 3;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);

            starPositions[i * 3] = Math.sin(phi) * Math.cos(theta) * radius;
            starPositions[i * 3 + 1] = Math.sin(phi) * Math.sin(theta) * radius + 0.5;
            starPositions[i * 3 + 2] = Math.cos(phi) * radius;

            // 星星颜色：蓝、紫、金、白随机
            const color = new THREE.Color().setHSL(0.6 + Math.random() * 0.3, 0.8, 0.5 + Math.random() * 0.5);
            starColors[i * 3] = color.r;
            starColors[i * 3 + 1] = color.g;
            starColors[i * 3 + 2] = color.b;
            
            sizes[i] = Math.random() * 0.15 + 0.05;
        }

        const particleGeometry = new THREE.BufferGeometry();
        particleGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        particleGeometry.setAttribute('color', new THREE.BufferAttribute(starColors, 3));
        particleGeometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

        // 创建粒子纹理 (一个发光的小圆点)
        const canvas = document.createElement('canvas');
        canvas.width = 32;
        canvas.height = 32;
        const ctx = canvas.getContext('2d');
        const gradient = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
        gradient.addColorStop(0, 'rgba(255,255,255,1)');
        gradient.addColorStop(0.5, 'rgba(255,255,255,0.8)');
        gradient.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 32, 32);
        const particleMap = new THREE.CanvasTexture(canvas);

        const particleMaterial = new THREE.PointsMaterial({
            size: 0.15,
            map: particleMap,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            vertexColors: true,
            transparent: true
        });

        const particles = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(particles);

        // 环境光
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        
        // 补光
        const fillLight = new THREE.DirectionalLight(0xffffff, 0.5);
        fillLight.position.set(1, 2, 2);
        scene.add(fillLight);

        // --- 4. 动画循环 ---
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.005;

            // 星星整体旋转
            particles.rotation.y += 0.002;
            particles.rotation.x = Math.sin(time * 0.5) * 0.1;
            particles.rotation.z = Math.sin(time * 0.3) * 0.1;

            // 中间大星星跳动
            star.scale.setScalar(1 + Math.sin(time * 8) * 0.1);
            glow.scale.setScalar(1 + Math.sin(time * 5) * 0.1);

            renderer.render(scene, camera);
        }

        animate();

        // --- 5. 窗口大小自适应 ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
